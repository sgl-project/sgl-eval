# Manifest for files vendored from NVIDIA/NeMo-Skills.
#
# Edit this file then run `python scripts/sync_vendored.py` to refresh the
# vendored sources. Banner comments at the top of each generated file
# point back here.
#
# Per ROADMAP.md "Dependency policy": external pip deps that vendored
# files import must mirror upstream's `core/requirements.txt` at
# `synced_from_sha`. Mirror in `pyproject.toml` directly.

upstream_repo: NVIDIA/NeMo-Skills
upstream_branch: main
synced_from_sha: 645cf567ff08c0ae9cc3fc8e1edbb975b3067816
synced_at: "2026-04-29"

# pip deps that vendored files actually `import`. Reflected in
# pyproject.toml. Anything upstream pulls in but our vendored files do
# not import (torch, transformers, flask, gradio, hydra-core, ...) is
# intentionally absent.
pinned_deps:
  math_verify: "[antlr4_9_3]"   # upstream pin: unversioned, with antlr4_9_3 extra
  latex2sympy2_extended: ""     # upstream pin: unversioned
  numpy: ""                     # upstream pin: unversioned
  tqdm: ""                      # upstream pin: unversioned (used by evaluator/base.py)

# Applied by sync_vendored.py to rewrite intra-nemo-skills imports so
# vendored files resolve under sgl_eval._vendored.nemo_skills. Audited
# by tests/test_no_untranslated_imports.py.
import_rewrites:
  "from nemo_skills.utils import": "from sgl_eval._vendored.nemo_skills._utils import"
  "from nemo_skills.evaluation.metrics.base import": "from sgl_eval._vendored.nemo_skills._metrics_base import"
  "from nemo_skills.evaluation.metrics.utils import": "from sgl_eval._vendored.nemo_skills._metrics_utils import"
  "from nemo_skills.evaluation.math_grader import": "from sgl_eval._vendored.nemo_skills.math_grader import"
  "from nemo_skills.evaluation.evaluator.base import": "from sgl_eval._vendored.nemo_skills.evaluator.base import"
  "from nemo_skills.evaluation.evaluator.math import": "from sgl_eval._vendored.nemo_skills.evaluator.math import"
  "from nemo_skills.evaluation.evaluator.mcq import": "from sgl_eval._vendored.nemo_skills.evaluator.mcq import"
  "from nemo_skills.dataset.utils import": "from sgl_eval._vendored.nemo_skills.dataset._utils import"

# Files synced verbatim from upstream (with rewrites + drop_functions +
# drop_imports applied, plus a provenance banner for .py / .yaml).
# `binary: true` copies bytes verbatim with no banner (data files).
files:
  # --- evaluation core ---
  - src: nemo_skills/evaluation/math_grader.py
    dst: math_grader.py
  - src: nemo_skills/evaluation/metrics/utils.py
    dst: _metrics_utils.py
  - src: nemo_skills/evaluation/metrics/base.py
    dst: _metrics_base.py
  - src: nemo_skills/evaluation/metrics/math_metrics.py
    dst: math_metrics.py
    drop_functions:
      - _compute_reward_at_k

  # --- evaluator wrappers ---
  - src: nemo_skills/evaluation/evaluator/base.py
    dst: evaluator/base.py
  - src: nemo_skills/evaluation/evaluator/math.py
    dst: evaluator/math.py
    # Lean4ProofEvaluator pulls in code_execution.proof_utils + sandbox;
    # we don't run Lean proofs, so drop the class and its imports.
    drop_functions:
      - Lean4ProofEvaluator
    drop_imports:
      - nemo_skills.code_execution
  - src: nemo_skills/evaluation/evaluator/mcq.py
    dst: evaluator/mcq.py

  # --- dataset utilities ---
  - src: nemo_skills/dataset/utils.py
    dst: dataset/_utils.py

  # --- per-benchmark dataset metadata + bundled data ---
  - src: nemo_skills/dataset/aime25/__init__.py
    dst: dataset/aime25/__init__.py
  - src: nemo_skills/dataset/aime25/test.txt
    dst: dataset/aime25/test.txt
    binary: true
  - src: nemo_skills/dataset/aime26/__init__.py
    dst: dataset/aime26/__init__.py
  - src: nemo_skills/dataset/aime24/__init__.py
    dst: dataset/aime24/__init__.py
  - src: nemo_skills/dataset/aime24/test.txt
    dst: dataset/aime24/test.txt
    binary: true
  - src: nemo_skills/dataset/gsm8k/__init__.py
    dst: dataset/gsm8k/__init__.py
  - src: nemo_skills/dataset/gsm8k/prepare.py
    dst: dataset/gsm8k/prepare.py
  - src: nemo_skills/dataset/mmlu/__init__.py
    dst: dataset/mmlu/__init__.py
  - src: nemo_skills/dataset/mmlu/prepare.py
    dst: dataset/mmlu/prepare.py
  - src: nemo_skills/dataset/gpqa/__init__.py
    dst: dataset/gpqa/__init__.py
  - src: nemo_skills/dataset/gpqa/prepare.py
    dst: dataset/gpqa/prepare.py

  # --- prompt templates ---
  - src: nemo_skills/prompt/config/generic/math.yaml
    dst: prompts/math.yaml
  - src: nemo_skills/prompt/config/eval/aai/mcq-4choices.yaml
    dst: prompts/mcq-4choices.yaml
  - src: nemo_skills/prompt/config/eval/aai/mcq-4choices-boxed.yaml
    dst: prompts/mcq-4choices-boxed.yaml

  # --- upstream's own behavior tests ---
  # Run as part of `pytest`. These are NS's canonical regression cases,
  # so any drift in the vendored grader / metrics / dep versions surfaces
  # as a test failure here. Do NOT hand-edit; refresh via sync_vendored.
  - src: tests/test_math_equal.py
    dst: tests/test_math_equal.py
  - src: tests/test_base_metrics.py
    dst: tests/test_base_metrics.py
