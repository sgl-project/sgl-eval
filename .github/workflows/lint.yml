name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: no-commit-to-branch

  vendored:
    # Every sgl_eval/_vendored/<pkg>/ must be a fresh sync of its manifest,
    # and no vendored file may import upstream-named modules or sgl-eval code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python scripts/sync_vendored.py --check
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/audit_vendored.py
